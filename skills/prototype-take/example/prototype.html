<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example prototype: a quick launcher</title>
<!--
  A tiny working prototype to film: ⌥Space (or the button) opens a launcher; typing filters it; Enter
  or a click opens the item, and a note says so. Everything lives on one 1200 × 750 stage, which the
  take's camera moves and scales.
-->
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; overflow: hidden; border-radius: 12px;
    background: radial-gradient(120% 90% at 30% 20%, #f3d9b1, #c98e5a 45%, #6b4a3a); }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: rgba(255,255,255,.35); backdrop-filter: blur(20px); font-size: 13px; color: #1d1d1f; }
  .bar b { font-weight: 700; } .bar span:last-child { margin-left: auto; }
  #open { position: absolute; left: 50%; top: 640px; transform: translateX(-50%); border: 0; border-radius: 12px; padding: 10px 16px;
    background: rgba(28,28,30,.6); color: #fff; font: 600 14px -apple-system, sans-serif; cursor: pointer; }
  #panel { position: absolute; left: 50%; top: 170px; width: 560px; transform: translate(-50%, 12px) scale(.96); opacity: 0; pointer-events: none;
    border-radius: 18px; background: rgba(255,255,255,.92); box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); transition: opacity .18s, transform .25s cubic-bezier(.2,.9,.3,1); overflow: hidden; }
  #panel.on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  #q { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid #eee; padding: 16px 20px; font: 500 20px -apple-system, sans-serif; outline: none; background: transparent; }
  #list { list-style: none; margin: 0; padding: 8px; }
  #list li { padding: 10px 12px; border-radius: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
  #list li i { width: 26px; height: 26px; border-radius: 7px; flex: none; }
  #list li.sel { background: #e8f0fe; }
  #note { position: absolute; right: 16px; top: 40px; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.95); box-shadow: 0 10px 30px -12px rgba(0,0,0,.4);
    opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .3s; }
  #note.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="bar"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Thu 9:41</span></div>
  <button id="open">Open launcher ⌥ Space</button>
  <div id="panel"><input id="q" placeholder="Search apps and files" autocomplete="off"><ul id="list"></ul></div>
  <div id="note"></div>
</div>
<script>
const ITEMS = [['Calendar', '#e5484d'], ['Notes', '#f5b700'], ['Photos', '#46a758'], ['Music', '#e93d82'], ['Maps', '#3e9b4f'], ['Mail', '#0090ff']];
const $ = (s) => document.querySelector(s);
let sel = 0, shown = ITEMS;
function render() {
  $('#list').innerHTML = shown.map(([n, c], i) => `<li class="${i === sel ? 'sel' : ''}" data-i="${i}"><i style="background:${c}"></i>${n}</li>`).join('');
}
function filter() { const q = $('#q').value.toLowerCase(); shown = ITEMS.filter(([n]) => n.toLowerCase().includes(q)); sel = 0; render(); }
function open() { $('#panel').classList.add('on'); $('#q').value = ''; filter(); setTimeout(() => $('#q').focus(), 0); }
function close() { $('#panel').classList.remove('on'); }
function launch(i) {
  const [n] = shown[i] || []; if (!n) return;
  close(); $('#note').textContent = `Opened ${n}`; $('#note').classList.add('on');
  setTimeout(() => $('#note').classList.remove('on'), 1800);
}
$('#open').onclick = open;
$('#q').oninput = filter;
$('#list').onclick = (e) => { const li = e.target.closest('li'); if (li) launch(+li.dataset.i); };
addEventListener('keydown', (e) => {
  if (e.altKey && e.code === 'Space') { e.preventDefault(); open(); return; }
  if (!$('#panel').classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'Enter') launch(sel);
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); render(); }
});
</script>
</body>
</html>
