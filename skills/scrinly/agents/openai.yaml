interface:
  display_name: "Scrinly Screenshots"
  short_description: "Capture, compare, and transform Scrinly screenshots"
  default_prompt: "Use $scrinly to capture a stored screenshot and return visual evidence with a safe credit limit."

dependencies:
  tools:
    - type: "mcp"
      value: "scrinly"
      description: "Scrinly's screenshot, comparison, and transformation MCP server"
      transport: "streamable_http"
      url: "https://mcp.scrinly.com/mcp"

policy:
  allow_implicit_invocation: true
