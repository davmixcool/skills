interface:
  display_name: "StashCue"
  short_description: "Plan and draft product promotion into a StashCue queue; the maker posts"
  default_prompt: "Use $stashcue to plan this week's posts for my product: check each community's rules, draft for each, and queue them spaced out."

dependencies:
  tools:
    - type: "mcp"
      value: "stashcue"
      description: "StashCue's queue, product briefs and community notes"
      transport: "streamable_http"
      url: "https://stashcue.app/mcp"

policy:
  allow_implicit_invocation: true
